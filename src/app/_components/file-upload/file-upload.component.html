<mat-card class="file-upload-card shadow-none border">
  <mat-card-content>
    <div class="header-info mb-3">
      <mat-chip-listbox>
        <mat-chip color="primary" selected>{{category | uppercase}} 附件清單</mat-chip>
      </mat-chip-listbox>
    </div>

    <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
      <table class="table align-middle">
        <thead class="bg-light sticky-top">
          <tr>
            <th style="width: 80px;">預覽</th>
            <th>檔案名稱</th>
            <th class="text-center">操作</th>
            <th class="text-right">大小</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of cloudfiles">
            <td>
              <div class="preview-box">
                <img *ngIf="isImage(data.name)" [src]="getCloudPreview(data.name)" 
                     class="img-thumbnail preview-img" (click)="download(data.name)">
                <mat-icon *ngIf="!isImage(data.name)" color="disabled" class="file-icon">insert_drive_file</mat-icon>
              </div>
            </td>
            <td>
              <div class="file-name-text" [matTooltip]="data.name">{{data.name}}</div>
            </td>
            <td class="text-center">
              <button mat-icon-button color="primary" (click)="download(data.name)" matTooltip="下載">
                <mat-icon>cloud_download</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="delete(data.name)" matTooltip="刪除">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
            <td class="text-right text-muted small">{{data.size/1024 | number:'0.1-1'}} KB</td>
          </tr>

          <tr *ngFor="let item of files; let i = index" class="table-warning">
            <td>
              <div class="preview-box">
                <img *ngIf="item.preview" [src]="item.preview" class="img-thumbnail preview-img">
                <mat-icon *ngIf="!item.preview" color="accent" class="file-icon">attach_file</mat-icon>
              </div>
            </td>
            <td>
              <div class="file-name-text text-truncate">{{item.file.name}}</div>
              <mat-progress-bar mode="determinate" [value]="item.progress" *ngIf="item.inProgress"></mat-progress-bar>
            </td>
            <td class="text-center">
              <button mat-icon-button color="accent" (click)="cancelSelection(i)" *ngIf="!item.inProgress">
                <mat-icon>cancel</mat-icon>
              </button>
              <span *ngIf="item.inProgress" class="small text-primary">{{item.progress}}%</span>
            </td>
            <td class="text-right text-muted small">{{item.file.size/1024 | number:'0.1-1'}} KB</td>
          </tr>
        </tbody>
      </table>
    </div>
  </mat-card-content>

  <mat-card-actions class="p-3 border-top bg-light">
    <div class="row g-2 w-100 m-0">
      <div class="col-6">
        <button mat-stroked-button color="primary" class="w-100 py-1" (click)="onClick()">
          <mat-icon>add_photo_alternate</mat-icon> 選擇檔案
        </button>
      </div>
      <div class="col-6">
        <button mat-raised-button color="warn" class="w-100 py-1" (click)="uploadFiles()" [disabled]="files.length === 0">
          <mat-icon>cloud_upload</mat-icon> 開始上傳
        </button>
      </div>
    </div>
  </mat-card-actions>
</mat-card>

<input type="file" #fileUpload multiple style="display:none;" accept="image/*,.pdf,.doc,.docx,.xlsx" />
