<div class="modal-header">
  <h1 class="modal-title">{{title}}</h1>
  <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross Click')">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="form" [formGroup]="formGroup">
    <div class="form-group" [hidden]="true">
      <input type="number" id="id" formControlName="id" readonly />
    </div>
    <div class="form-group">
      <div class="form-name">
        <label for="book_id">所屬</label>
      </div>
      <div class="form-input">
        <ng-select
          [items]="booklist"
          bindValue="book_id"
          bindLabel="name"
          [clearable]="false"
          formControlName="book_id"
          [class.invalid]="isError('book_id')"
          [notFoundText]="'沒有找到符合的項目'" 
          >
        </ng-select>
        <small class="text-danger" *ngIf="errorType('book_id', 'required')">*必填欄位</small>
      </div>
    </div>
    <div class="form-group">
      <div class="form-name">
        <label for="dept_name">部門名稱</label>
      </div>
      <div class="form-input">
        <input type="text" id="dept_name" formControlName="dept_name" [class.invalid]="isError('dept_name')" autocomplete="off"/>
        <small class="text-danger" *ngIf="errorType('dept_name', 'required')">*必填欄位</small>
      </div>
    </div>

    <div class="form-group">
      <div class="form-name">
        <label for="manager_id">部門主管</label>
      </div>
      <div class="form-input">
        <ng-select
          [items]="userlist"
          bindValue="id"
          bindLabel="username"
          [clearable]="true"
          formControlName="manager_id"
          [class.invalid]="isError('manager_id')"
          [placeholder]="'請選擇部門主管'"
          [notFoundText]="'沒有找到符合的人員'">
        </ng-select>
      </div>
    </div>

    <div class="form-group">
      <div class="form-name">
        <label for="description">說明</label>
      </div>
      <div class="form-input">
        <input type="text" id="description" formControlName="description" [class.invalid]="isError('description')" autocomplete="off"/>
      </div>
    </div>

  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-cancel" (click)="modal.dismiss('cancel click')">取消</button>
    <button type="button" class="btn btn-primary" (click)="submit()"
      [disabled]="!formGroup.valid || formGroup.pristine">確認</button>
  </div>
</div>
