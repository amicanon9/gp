<div class="modal-header">
  <h1 class="modal-title">{{ title }}</h1>
  <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross Click')">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body">
  <div class="form" [formGroup]="formGroup">

     <div class="form-group">
      <div class="form-name">
        <label for="bank_id">銀行名稱</label>
      </div>
      <div class="form-input">
       <ng-select 
        [items]="banklist"
        bindValue="id"
        bindLabel="bank_name"
        [clearable]="false"
        formControlName="bank_id"
        [class.invalid]="isError('bank_id')"
        [notFoundText]="'沒有找到符合的項目'">
       </ng-select>
        <small class="text-danger" *ngIf="errorType('bank_id', 'required')">*必填欄位</small>
      </div>
    </div>
    <div class="form-group">
      <div class="form-name">
        <label for="branch_no">分支機構代號</label>
      </div>
      <div class="form-input">
        <input type="text" id="branch_no" formControlName="branch_no" [class.invalid]="isError('branch_no')" />
        <small class="text-danger" *ngIf="errorType('branch_no', 'maxlength')">*長度超過50字元</small>
        <small class="text-danger" *ngIf="errorType('branch_no', 'required')">*必填欄位</small>
      </div>
    </div>

    <div class="form-group">
      <div class="form-name">
        <label for="branch_name">分支機構名稱</label>
      </div>
      <div class="form-input">
        <input type="text" id="branch_name" formControlName="branch_name" [class.invalid]="isError('branch_name')" />
        <small class="text-danger" *ngIf="errorType('branch_name', 'maxlength')">*長度超過50字元</small>
        <small class="text-danger" *ngIf="errorType('branch_name', 'required')">*必填欄位</small>
      </div>
    </div>

    <div class="form-group">
      <div class="form-name">
        <label for="description">說明</label>
      </div>
      <div class="form-input">
        <input type="text" id="description" formControlName="description" [class.invalid]="isError('description')" />
        <small class="text-danger" *ngIf="errorType('description', 'maxlength')">*長度超過50字元</small>
      </div>
    </div>

   
   

<!-- 是否停用 -->
    <div class="form-group">
      <mat-checkbox formControlName="disable">是否停用</mat-checkbox>
    </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-cancel" (click)="modal.dismiss('cancel click')">取消</button>
    <button type="button" class="btn btn-danger" (click)="submit()" [disabled]="!formGroup.valid || formGroup.pristine">確認</button>
  </div>
</div>
