<div class="modal-header">
  <h1 class="modal-title">{{ title }} - {{ projectName }}</h1>
  <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross Click')">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body">
  <div class="form-section" [formGroup]="formGroup">
    <div style="padding-left: 1%"><h2>{{ isEdit ? '編輯週報' : '新增週報' }}</h2></div>
    <div class="row">
      <div class="col-md-4 form-group">
        <div class="form-name"><label>年度</label></div>
        <div class="form-input">
          <input type="number" formControlName="year" />
        </div>
      </div>
      <div class="col-md-4 form-group">
        <div class="form-name"><label>週次</label></div>
        <div class="form-input">
          <input type="number" formControlName="week" />
        </div>
      </div>
      <div class="col-md-4 form-group">
        <div class="form-name"><label for="ags_status">AGS 狀態</label></div>
        <div class="form-input">
          <ng-select id="ags_status" [items]="agslist" bindValue="code" bindLabel="description" [clearable]="true"
            formControlName="ags_status"  [notFoundText]="'查無資料'"  >
          </ng-select>
        </div>
      </div>
  
    </div>
    <div style="padding-left: 1%"><h2>週報內容</h2></div>
    <div class="col-md-12">
       <input type="text" formControlName="content" placeholder="請輸入週報主旨..." />
      </div>
      <div class="col-md-12" style="padding-top: 10px;">
        <textarea style="width: 100%;padding: 5px 10px;border-radius: 5px;" formControlName="content_detail" rows="4" placeholder="請輸入週報內容..."></textarea>
      </div>
    <div class="text-right mb-3">
      <button type="button" class="btn btn-secondary" *ngIf="isEdit" (click)="resetForm()">取消編輯</button>
      <button type="button" class="btn btn-primary" [disabled]="!formGroup.valid" (click)="submit()">
        {{ isEdit ? '更新週報' : '儲存週報' }}
      </button>
    </div>
  </div>

  <hr>

  <div style="padding-left: 1%"><h2>週報紀錄</h2></div>
  <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
  <table class="table">
    <thead class="thead-light">
      <tr>
        <th style="width: 80px;" class="text-center">年度</th>
        <th style="width: 50px;" class="text-center">週次</th>
        <th style="width: 100px;" class="text-center">AGS狀態</th>
        <th style="width: 240px;">週報主旨</th>
        <th>週報內容</th>
        <th style="width: 120px;" class="text-center">操作</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of reportList"
    [ngStyle]="{
      'background-color': 
        item.ags?.code === 'A6' ? 'rgba(108, 117, 125, 0.15)' : 
        item.ags?.code === 'A5' ? 'rgba(173, 181, 189, 0.15)' : 
        item.ags?.code === 'A4' ? 'rgba(144, 238, 144, 0.2)' : 'transparent'
    }">
        
        <td class="text-center" style="vertical-align: middle;">{{ item.year }}</td>
        <td class="text-center" style="vertical-align: middle;">{{ item.week }}</td>
        
        <td class="text-center" style="vertical-align: middle;">
          <span *ngIf="item.ags" class="badge" [ngStyle]="{
            'background-color': 
              item.ags?.code === 'A6' ? '#6c757d' : 
              item.ags?.code === 'A5' ? '#adb5bd' : 
              item.ags?.code === 'A4' ? '#90ee90' : '#6c757d',
            'color': item.ags?.code === 'A4' ? '#000' : '#fff'
          }" style="padding: 5px 10px; min-width: 50px;">
            {{ item.ags?.description }}
          </span>
        </td>

        <td style="white-space: pre-wrap; vertical-align: middle;">{{ item.content }}</td>
        <td style="white-space: pre-wrap; vertical-align: middle;">{{ item.content_detail }}</td>
        
        <td style="white-space: nowrap; vertical-align: middle;" class="text-center">
          <button type="button" class="btn btn-outline-primary btn-sm p-1 mr-1" 
            (click)="editEntry(item)" title="編輯">
            <mat-icon style="vertical-align: middle;">edit</mat-icon>
          </button>

          <button type="button" class="btn btn-outline-danger btn-sm p-1" 
            (click)="deleteEntry(item.id)" title="刪除">
            <mat-icon style="vertical-align: middle;">delete</mat-icon>
          </button>
        </td>
      </tr>

      <tr *ngIf="reportList.length === 0">
        <td colspan="6" class="text-center text-muted p-4">尚無週報紀錄</td>
      </tr>
    </tbody>
  </table>
</div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-cancel" (click)="modal.dismiss('cancel click')">關閉</button>
</div>
