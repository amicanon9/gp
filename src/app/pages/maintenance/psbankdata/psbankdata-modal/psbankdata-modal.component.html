<div class="modal-header">
  <h1 class="modal-title">{{ title }}</h1>
  <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross Click')">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body">
  <div class="form" [formGroup]="formGroup">

  
 <div class="form-group">
      <div class="form-name">
        <label for="info_id">購電業</label>
      </div>
      <div class="form-input">
      <ng-select 
        [items]="infolist"
        bindValue="id"
        bindLabel="ps_name"
        [clearable]="false"
        formControlName="info_id"
        [class.invalid]="isError('info_id')"
         [notFoundText]="'沒有找到符合的項目'">
      </ng-select>
        <small class="text-danger" *ngIf="errorType('info_id', 'required')">*必填欄位</small>
      </div>
    </div>

    <div class="form-group">
      <div class="form-name">
        <label for="branch_id">銀行名稱</label>
      </div>
      <div class="form-input">
        <ng-select 
        [items]="branchlist"
        bindValue="id"
        bindLabel="label"
        [clearable]="false"
        formControlName="branch_id"
        [class.invalid]="isError('branch_id')"
         [notFoundText]="'沒有找到符合的項目'"
         [virtualScroll]="true">
      </ng-select>
        <small class="text-danger" *ngIf="errorType('branch_id', 'required')">*必填欄位</small>
      </div>
    </div>

 <div class="form-group">
      <div class="form-name">
        <label for="bank_account_number">銀行帳號</label>
      </div>
      <div class="form-input">
        <input type="text"  formControlName="bank_account_number" [class.invalid]="isError('bank_account_number')" />
        <small class="text-danger" *ngIf="errorType('bank_account_number', 'maxlength')">*長度超過25字元</small>
      </div>
    </div>


    <div class="form-group">
      <div class="form-name">
        <label for="description">說明</label>
      </div>
      <div class="form-input">
        <input type="text" id="description" formControlName="description" [class.invalid]="isError('description')" />
        <small class="text-danger" *ngIf="errorType('description', 'maxlength')">*長度超過50字元</small>
      </div>
    </div>

   


  <div class="modal-footer">
    <button type="button" class="btn btn-cancel" (click)="modal.dismiss('cancel click')">取消</button>
    <button type="button" class="btn btn-danger" (click)="submit()" [disabled]="!formGroup.valid || formGroup.pristine">確認</button>
  </div>
</div>
